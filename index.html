<!DOCTYPE html>
<head>

</head>
<body>
  <canvas id="canvas" width="1000" height="1000" style="background-color:#101E32"></canvas>
  <script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let radius = canvas.height / 2;
ctx.translate(radius, radius);
radius = radius * 0.90 
drawClock();

function drawClock() {
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0 , 2*Math.PI);
  ctx.lineWidth = radius*0.05;
  ctx.strokeStyle = 'white';
  ctx.stroke();
}
function drawface()
{
   for(let num=1;num<61;num++)
   {
    if(num%5==0)
    {
      let ang = num * Math.PI / 6;
      ctx.rotate(ang);
      ctx.translate(0, -radius * 0.85);
      ctx.rotate(-ang);
      ctx.beginPath();
      ctx.moveTo(radius*0.82, 0);
      ctx.lineto(radius*0.78,0);
      ctx.lineWidth=10;
      ctx.stroke();
      ctx.rotate(ang);
      ctx.translate(0, radius * 0.85);
      ctx.rotate(-ang);

      continue;
    }
    let ang = num * Math.PI / 6;
      ctx.rotate(ang);
      ctx.translate(0, -radius * 0.85);
      ctx.rotate(-ang);
      ctx.beginPath();
      ctx.moveTo(radius*0.82, 0);
      ctx.lineto(radius*0.8,0);
      ctx.lineWidth=5;
      ctx.stroke();
      ctx.rotate(ang);
      ctx.translate(0, radius * 0.85);
      ctx.rotate(-ang);
   }
}
</script>
</body>
