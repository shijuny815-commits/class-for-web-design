<!DOCTYPE html>
<html>
<head></head>
<body>
  <canvas id="canvas" width="1000" height="1000" style="background-color:#101E32"></canvas>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let radius = canvas.height / 2;
    ctx.translate(radius, radius);
    radius = radius * 0.90;

    drawClock();
    drawFace();

    function drawClock() {
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, 2 * Math.PI);
      ctx.lineWidth = radius * 0.05; // Outer ring thickness (increase 0.05 to make it thicker)
      ctx.strokeStyle = '#9A7B5E';   // Gold border
      ctx.stroke();
    }

    function drawFace() {
      for (let num = 1; num <= 60; num++) {
        let ang = num * Math.PI / 30; // 60 ticks around 2π (360°)
        ctx.save();
        ctx.rotate(ang);
        ctx.beginPath();

        if (num % 5 === 0) {
          // Hour ticks (longer and thicker)
          ctx.moveTo(0, -radius * 0.92);
          ctx.lineTo(0, -radius * 0.80);
          ctx.lineWidth = 10;
          ctx.strokeStyle = '#AF8E73'; // Highlight gold
        } else {
          // Minute ticks (shorter and thinner)
          ctx.moveTo(0, -radius * 0.92);
          ctx.lineTo(0, -radius * 0.86);
          ctx.lineWidth = 5;
          ctx.strokeStyle = '#9A7B5E'; // Mid-tone gold
        }

        ctx.stroke();
        ctx.restore();
      }
    }
  </script>
</body>
</html>
