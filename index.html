  <canvas id="canvas" width="400" height="400" style="background-color:#101E32"></canvas>
  <script>
    const canvas=document.getelementbyid("canvas");
    const ctx = canvas.getContext("2d");
    let redius=canvas.height/2;
    ctx.translate(redius,redius);
    redius=redius*0.9;
    drawface();
    function drawface()
    {
      ctx.arc(0,0,redius,0,Math.PI*2);
      ctx.fillStyle="white";
      ctx.fill();
    }
