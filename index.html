<!DOCTYPE html>
<html>
<head></head>
<body>
  <canvas id="canvas" width="1000" height="1000" style="background-color:#101E32"></canvas>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let radius = canvas.height / 2;
    ctx.translate(radius, radius);
    radius = radius * 0.90;

    drawClock();
    drawface();
    drawlinebetween(0.95);
    drawlinebetween(0.75);
    drawword();
    function drawClock() {
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, 2 * Math.PI);
      ctx.lineWidth = radius * 0.05;
      ctx.strokeStyle = '#9A7B5E';
      ctx.stroke();
    }

    function drawface() {
      for (let num = 1; num < 61; num++) {
        let ang = num * Math.PI / 30; 

        if (num % 5 == 0) {
          ctx.rotate(ang);
          ctx.translate(0, -radius * 0.85);
          ctx.beginPath();
          ctx.moveTo(0, -radius * 0.07); 
          ctx.lineTo(0, radius * 0.05);
          ctx.lineWidth = 10;
          ctx.strokeStyle = '#AF8E73';
          ctx.stroke();
          ctx.translate(0, radius * 0.85); 
          ctx.rotate(-ang);                
          continue;
        }

        ctx.rotate(ang);
        ctx.translate(0, -radius * 0.85);
        ctx.beginPath();
        ctx.moveTo(0, -radius * 0.07);
        ctx.lineTo(0, 0);
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#9A7B5E';
        ctx.stroke();
        ctx.translate(0, radius * 0.85);
        ctx.rotate(-ang);
      }
    }
    function drawlinebetween(n)
    {
      ctx.beginPath();
      ctx.arc(0, 0, radius*n, 0, 2 * Math.PI);
      ctx.lineWidth = radius * 0.005;
      ctx.strokeStyle = '#9A7B5E';
      ctx.stroke();
    }
    function drawword()
    {
      ctx.font = `${radius * 0.15}px serif`; // Match the serif font style from your image
      ctx.textBaseline = "middle";
      ctx.textAlign = "center";
      ctx.fillStyle = "#9A7B5E";
      let romans=["IIV","VI","IX","XII"];
      for (let i = 0; i < 4; i++) {
        let ang = i * Math.PI*3 / 6;
        
        ctx.rotate(ang);
        ctx.translate(0, -radius * 0.68); 
        ctx.rotate(-ang); 
        
        ctx.fillText(romans[i], 0, 0);
        
        ctx.rotate(ang);
        ctx.translate(0, radius * 0.68);
        ctx.rotate(-ang);
      }
    }
  </script>
</body>
</html>
